command:
  - "python"
  - "app.py"
env:
  # ID of the Databricks Job 'code-yellow-page-notifier' that sends the
  # incident-page email. When set, clicking 'Send Page' in the UI fires this
  # job (Option 1 architecture). Falls back to in-process SMTP / mailto if
  # unset.
  - name: PAGE_NOTIFIER_JOB_ID
    value: "96755215589266"
  - name: PAGE_EMAIL_TO
    value: "sahil.merali@databricks.com"
  - name: PAGE_SECRET_SCOPE
    value: "code-yellow"
  # Genie space embedded in the right-side panel.  We use the /embed/genie/
  # iframe surface (browser-friendly frame-ancestors); the "Open in Databricks"
  # link in the panel header still points at the full /genie/rooms/<id> UI.
  - name: GENIE_SPACE_ID
    value: "01f1497305f91728a36e24163f0d10be"
  - name: GENIE_WORKSPACE
    value: "https://fevm-classic-stable-q1odfo.cloud.databricks.com"
